<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House of MD</title>
  </head>
  <body>
    <script type="text/javascript">
      ;(function () {
        // GitHub Pages SPA redirect:
        // - Project pages: /<repo>/some/path -> /<repo>/?/some/path
        // - Custom domain: /some/path -> /? /some/path
        var isGithubIo = window.location.hostname.endsWith('github.io')
        var segments = window.location.pathname.split('/')
        var base = '/'
        var rest = ''

        if (isGithubIo) {
          var repo = segments[1] || ''
          base = '/' + repo + '/'
          rest = segments.slice(2).join('/')
        } else {
          rest = segments.slice(1).join('/')
        }

        var target =
          base +
          '?/' +
          rest +
          (window.location.search ? window.location.search.replace('?', '&') : '') +
          window.location.hash
        window.location.replace(target)
      })()
    </script>
  </body>
</html>
